<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>포항 시민 회원가입</title>

    <style>

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4f8cff, #6fc3ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 380px;
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }

        .notice-box {
            background: #eef5ff;
            border: 1px solid #b7d4ff;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: left;
        }

        .notice-box strong {
            color: #2f5fb3;
            font-size: 14px;
        }

        .notice-box p {
            margin: 8px 0 0;
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }

        .small-text {
            font-size: 12px;
            color: #888;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #4f8cff;
            outline: none;
            box-shadow: 0 0 5px rgba(79,140,255,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #4f8cff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #3b6fdc;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>포항시 주민 회원가입</h1>

    <div class="subtitle">
        한동대학교 도서관 포항시 주민 서비스
    </div>

    <div class="notice-box">

        <strong>포항시 주민 전용 서비스</strong>

        <p>
            본 회원가입은 포항시 주민만 이용 가능합니다.
        </p>

        <p class="small-text">
            시민 계정은 도서 대출만 가능하며,
            학위복 대여 서비스는 이용할 수 없습니다.
        </p>

    </div>

    <input
            type="text"
            id="username"
            placeholder="아이디">

    <input
            type="password"
            id="password"
            placeholder="비밀번호">

    <input
            type="password"
            id="confirmPassword"
            placeholder="비밀번호 확인">

    <button onclick="register()">
        회원가입
    </button>
    <button onclick="window.location.href='/account/loginUI';" style="margin-top: 10px; background: #eee; color: #333;">
        로그인으로 돌아가기
    </button>

    <p id="message"></p>

</div>

<script>

    function register() {

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        // 빈칸 검사
        if (
            username.trim() === "" ||
            password.trim() === ""
        ) {

            document.getElementById("message").style.color =
                "red";

            document.getElementById("message").innerText =
                "아이디와 비밀번호를 입력해주세요.";

            return;
        }

        // 비밀번호 확인 검사
        if (password !== confirmPassword) {

            document.getElementById("message").style.color =
                "red";

            document.getElementById("message").innerText =
                "비밀번호가 일치하지 않습니다.";

            return;
        }

        fetch("/account/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                username: username,

                password: password
            })
        })

        .then(res => res.json())

        .then(data => {

            if (data.success) {

                alert("회원가입이 완료되었습니다!");

                window.location.href ="/account/loginUI";

            } else {

                document.getElementById("message").style.color =
                    "red";

                document.getElementById("message").innerText =
                    data.message || "회원가입 실패";
            }
        })

        .catch(error => {

            console.error(error);

            document.getElementById("message").style.color =
                "red";

            document.getElementById("message").innerText =
                "오류가 발생했습니다.";
        });
    }

</script>

</body>
</html>
