<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HGU 도서 관리자 대시보드</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #ecf0f1;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --primary: #3498db;
            --primary-hover: #2980b9;
            --accent-purple: #9b59b6;
            --accent-green: #27ae60;
            --accent-red: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #3498db, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
        }

        .btn-danger {
            background-color: var(--accent-red);
            color: white;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .btn-success {
            background-color: var(--accent-green);
            color: white;
        }

        .btn-success:hover {
            background-color: #219a52;
        }

        .dashboard-container {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex-grow: 1;
        }

        .tabs {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .tab:hover {
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.05);
        }

        .tab.active {
            color: white;
            background: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.25rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            background: white;
            border: 1px solid #bdc3c7;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            background: #f1f5f9;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(0, 0, 0, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-available {
            background-color: #d5f5e3;
            color: var(--accent-green);
        }

        .badge-loaned {
            background-color: #fadbd8;
            color: var(--accent-red);
        }

        .badge-discarded {
            background-color: #f1f5f9;
            color: var(--text-muted);
        }

        .badge-repair {
            background-color: #fef9e7;
            color: #d68910;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border: 1px solid var(--border-color);
            width: 500px;
            max-width: 90%;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        .modal-close:hover {
            color: var(--text-main);
        }

        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(to right, #27ae60, #219a52);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(39, 174, 96, 0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 9999;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .action-row {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

<header>
    <h1>HGU Library Admin</h1>
    <div class="user-nav">
        <button class="btn btn-secondary" onclick="window.location.href='/book/SearchBookUI'">← 도서 검색 화면</button>
        <button class="btn btn-danger" onclick="logout()">로그아웃</button>
    </div>
</header>

<div class="dashboard-container">
    <div class="tabs">
        <div id="tab-books" class="tab active" onclick="switchTab('books')">📘 도서 목록 & 등록</div>
        <div id="tab-copies" class="tab" onclick="switchTab('copies')">📋 사본 상태 관리</div>
    </div>

    <!-- Tab 1: 도서 원형 관리 -->
    <div id="panel-books" class="tab-panel">
        <div class="grid">
            <div class="card">
                <h2 id="form-title">➕ 신규 도서 등록</h2>
                <form id="book-form" onsubmit="saveBook(event)">
                    <input type="hidden" id="edit-book-id">
                    <div class="form-group">
                        <label for="book-title">도서 제목</label>
                        <input type="text" id="book-title" class="form-control" placeholder="예: 토비의 스프링" required>
                    </div>
                    <div class="form-group">
                        <label for="book-author">저자</label>
                        <input type="text" id="book-author" class="form-control" placeholder="예: 이일민" required>
                    </div>
                    <div class="form-group">
                        <label for="book-publisher">출판사</label>
                        <input type="text" id="book-publisher" class="form-control" placeholder="예: 에이콘" required>
                    </div>
                    <div class="form-group">
                        <label for="book-isbn">ISBN</label>
                        <input type="text" id="book-isbn" class="form-control" placeholder="예: 9788960773431" required>
                    </div>
                    <div class="form-group">
                        <label for="book-category">카테고리</label>
                        <select id="book-category" class="form-control">
                            <option value="소설">소설</option>
                            <option value="컴퓨터공학">컴퓨터공학</option>
                            <option value="역사">역사</option>
                            <option value="과학">과학</option>
                            <option value="경영">경영</option>
                            <option value="철학">철학</option>
                            <option value="자기계발">자기계발</option>
                            <option value="수학">수학</option>
                            <option value="학위복">학위복</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 20px;">
                        <button type="submit" id="btn-submit-book" class="btn btn-primary" style="flex: 1;">등록하기</button>
                        <button type="button" id="btn-cancel-edit" class="btn btn-secondary" style="display: none;" onclick="cancelEditBook()">취소</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2>📘 등록된 도서 원본 목록</h2>
                <div style="overflow-x: auto;">
                    <table id="books-table">
                        <thead>
                            <tr>
                                <th>도서 ID</th>
                                <th>제목 / 저자</th>
                                <th>출판사 / ISBN</th>
                                <th>분류</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 데이터 채워짐 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab 2: 도서 사본 관리 -->
    <div id="panel-copies" class="tab-panel" style="display: none;">
        <div class="grid">
            <div class="card">
                <h2>➕ 도서 사본 추가</h2>
                <div class="form-group">
                    <label for="copy-select-book">대상 도서 선택</label>
                    <select id="copy-select-book" class="form-control">
                        <!-- 데이터 채워짐 -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="copy-location">서가 위치</label>
                    <input type="text" id="copy-location" class="form-control" placeholder="예: 2F-C05" required>
                </div>
                <button class="btn btn-primary" onclick="addCopy()" style="width: 100%; margin-top: 10px;">사본 등록</button>
            </div>

            <div class="card">
                <h2>📋 선택 도서의 실물 사본 목록</h2>
                <div class="form-group" style="max-width: 300px;">
                    <label for="filter-select-book">도서 필터</label>
                    <select id="filter-select-book" class="form-control" onchange="loadCopies(this.value)">
                        <!-- 데이터 채워짐 -->
                    </select>
                </div>
                <div style="overflow-x: auto; margin-top: 20px;">
                    <table id="copies-table">
                        <thead>
                            <tr>
                                <th>사본 ID</th>
                                <th>바코드</th>
                                <th>서가 위치</th>
                                <th>현재 상태</th>
                                <th>상태 변경 / 관리</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-muted);">도서를 선택하세요.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 수정 모달 (사용안함 - 인라인 폼 활용) -->

<div id="toast">✅ 작업이 성공적으로 처리되었습니다.</div>

<script>
    function parseJwt(token) {
        const base64Url = token.split(".")[1];
        const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        const jsonPayload = decodeURIComponent(
            atob(base64)
                .split("")
                .map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
                .join("")
        );
        return JSON.parse(jsonPayload);
    }

    const token = localStorage.getItem("accessToken");
    if (!token) {
        alert("관리자 로그인이 필요합니다.");
        window.location.replace("/account/loginUI");
    } else {
        try {
            const payload = parseJwt(token);
            if (payload.role !== "LIBRARIAN" && payload.role !== "ADMIN") {
                alert("권한이 없습니다. 사서 또는 어드민만 접근 가능합니다.");
                window.location.replace("/book/SearchBookUI");
            }
        } catch (e) {
            console.error(e);
            alert("유효하지 않은 토큰입니다. 다시 로그인해주세요.");
            window.location.replace("/account/loginUI");
        }
    }

    function authHeader() {
        return {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        };
    }

    window.onload = function() {
        loadBooks();
    };

    let allBooksList = [];

    // 탭 전환
    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');

        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('panel-' + tabId).style.display = 'block';

        if (tabId === 'copies') {
            loadBooksForCopiesTab();
        } else {
            loadBooks();
        }
    }

    // 도서 원형 목록 조회
    function loadBooks() {
        fetch("/book/admin/allBooks", {
            method: "GET",
            headers: authHeader()
        })
        .then(res => {
            if (res.status === 401) {
                alert("인증 토큰이 유효하지 않습니다.");
                window.location.replace("/account/loginUI");
                return;
            }
            return res.json();
        })
        .then(books => {
            allBooksList = books || [];
            const tbody = document.querySelector("#books-table tbody");
            tbody.innerHTML = "";

            if (allBooksList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">등록된 도서가 없습니다.</td></tr>`;
                return;
            }

            allBooksList.forEach(book => {
                const tr = document.createElement("tr");
                const isGown = book.category === "학위복";
                const titleIcon = isGown ? "🎓 " : "📘 ";
                const badgeStyle = isGown 
                    ? "background-color: rgba(155, 89, 182, 0.1); color: #8e44ad;" 
                    : "background-color: rgba(52, 152, 219, 0.1); color: #2980b9;";
                const authorHtml = isGown ? "" : `<div style="font-size:0.85em; color:var(--text-muted);">${book.author}</div>`;
                const isbnHtml = isGown ? "" : `<div style="font-size:0.85em; color:var(--text-muted);">${book.isbn}</div>`;
                const publisherText = isGown ? `${book.publisher} (제공처)` : book.publisher;
                tr.innerHTML = `
                    <td><strong>${book.bookId}</strong></td>
                    <td>
                        <div style="font-weight:bold;">${titleIcon}${book.title}</div>
                        ${authorHtml}
                    </td>
                    <td>
                        <div>${publisherText}</div>
                        ${isbnHtml}
                    </td>
                    <td><span class="badge" style="${badgeStyle}">${book.category}</span></td>
                    <td>
                        <button class="btn btn-secondary" style="padding:6px 12px; font-size:0.8rem;" onclick="editBookMode('${book.bookId}')">수정</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });
    }

    // 사본 탭에서 도서 목록 셀렉트박스 채우기
    function loadBooksForCopiesTab() {
        fetch("/book/admin/allBooks", {
            method: "GET",
            headers: authHeader()
        })
        .then(res => res.json())
        .then(books => {
            const selectAdd = document.getElementById("copy-select-book");
            const selectFilter = document.getElementById("filter-select-book");
            
            selectAdd.innerHTML = "";
            selectFilter.innerHTML = `<option value="">-- 도서 선택 --</option>`;

            books.forEach(b => {
                const optionHtml = `<option value="${b.bookId}">${b.title} (${b.author})</option>`;
                selectAdd.innerHTML += optionHtml;
                selectFilter.innerHTML += optionHtml;
            });

            const filterVal = selectFilter.value;
            if (filterVal) {
                loadCopies(filterVal);
            }
        });
    }

    // 도서 원형 저장 (등록/수정)
    function saveBook(e) {
        e.preventDefault();

        const editId = document.getElementById("edit-book-id").value;
        const title = document.getElementById("book-title").value;
        const author = document.getElementById("book-author").value;
        const publisher = document.getElementById("book-publisher").value;
        const isbn = document.getElementById("book-isbn").value;
        const category = document.getElementById("book-category").value;

        const bookData = { title, author, publisher, isbn, category };

        let url = "/book/admin/addBook";
        if (editId) {
            url = `/book/admin/updateInfo?bookId=${encodeURIComponent(editId)}`;
        }

        fetch(url, {
            method: "POST",
            headers: authHeader(),
            body: JSON.stringify(bookData)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showToast(editId ? "✏️ 도서 정보가 수정되었습니다." : "✅ 신규 도서가 등록되었습니다.");
                cancelEditBook();
                loadBooks();
            } else {
                alert("실패: " + data.message);
            }
        });
    }

    // 도서 수정 모드 진입
    function editBookMode(bookId) {
        const book = allBooksList.find(b => b.bookId === bookId);
        if (!book) return;

        document.getElementById("edit-book-id").value = book.bookId;
        document.getElementById("book-title").value = book.title;
        document.getElementById("book-author").value = book.author;
        document.getElementById("book-publisher").value = book.publisher;
        document.getElementById("book-isbn").value = book.isbn;
        document.getElementById("book-category").value = book.category;

        document.getElementById("form-title").innerText = "✏️ 도서 정보 수정 (" + book.bookId + ")";
        document.getElementById("btn-submit-book").innerText = "수정 완료";
        document.getElementById("btn-cancel-edit").style.display = "block";
    }

    // 도서 수정 취소
    function cancelEditBook() {
        document.getElementById("edit-book-id").value = "";
        document.getElementById("book-form").reset();

        document.getElementById("form-title").innerText = "➕ 신규 도서 등록";
        document.getElementById("btn-submit-book").innerText = "등록하기";
        document.getElementById("btn-cancel-edit").style.display = "none";
    }

    // 특정 도서 사본 목록 조회
    function loadCopies(bookId) {
        if (!bookId) {
            document.querySelector("#copies-table tbody").innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">도서를 선택하세요.</td></tr>`;
            return;
        }

        fetch(`/book/copies?bookId=${encodeURIComponent(bookId)}`, {
            headers: authHeader()
        })
        .then(res => res.json())
        .then(copies => {
            const tbody = document.querySelector("#copies-table tbody");
            tbody.innerHTML = "";

            if (copies.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">이 책에 등록된 실물 사본이 없습니다.</td></tr>`;
                return;
            }

            copies.forEach(copy => {
                let badgeClass = "badge-available";
                if (copy.status === "대출중") badgeClass = "badge-loaned";
                else if (copy.status === "폐기됨") badgeClass = "badge-discarded";
                else if (copy.status === "수선중") badgeClass = "badge-repair";

                let actionHtml = "";
                if (copy.status !== "폐기됨") {
                    actionHtml = `
                        <div class="action-row">
                            <select class="form-control" style="width: auto; padding: 4px 8px; font-size: 0.8rem;" onchange="changeCopyStatus('${copy.copyId}', this.value)">
                                <option value="">-- 상태 변경 --</option>
                                <option value="대출가능" ${copy.status === '대출가능' ? 'selected' : ''}>대출가능</option>
                                <option value="대출중" ${copy.status === '대출중' ? 'selected' : ''}>대출중</option>
                                <option value="수선중" ${copy.status === '수선중' ? 'selected' : ''}>수선중</option>
                                <option value="분실" ${copy.status === '분실' ? 'selected' : ''}>분실</option>
                            </select>
                            <button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="discardCopy('${copy.copyId}')">폐기</button>
                        </div>
                    `;
                } else {
                    actionHtml = `<span style="color: var(--text-muted);">조작 불가</span>`;
                }

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${copy.copyId}</strong></td>
                    <td><code>${copy.barcode}</code></td>
                    <td>${copy.location}</td>
                    <td><span class="badge ${badgeClass}">${copy.status}</span></td>
                    <td>${actionHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    }

    // 도서 사본 등록
    function addCopy() {
        const bookId = document.getElementById("copy-select-book").value;
        const location = document.getElementById("copy-location").value;

        if (!bookId || !location) {
            alert("도서와 위치 정보를 입력하세요.");
            return;
        }

        fetch(`/book/admin/addCopy?bookId=${encodeURIComponent(bookId)}&location=${encodeURIComponent(location)}`, {
            method: "POST",
            headers: authHeader()
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showToast("📋 사본이 성공적으로 등록되었습니다. (Observer 알림 작동)");
                document.getElementById("copy-location").value = "";
                
                // 필터 셀렉트박스를 해당 책으로 전환하여 보여주기
                document.getElementById("filter-select-book").value = bookId;
                loadCopies(bookId);
            } else {
                alert("실패: " + data.message);
            }
        });
    }

    // 사본 상태 업데이트
    function changeCopyStatus(copyId, status) {
        if (!status) return;

        fetch(`/book/admin/updateCopyStatus?copyId=${encodeURIComponent(copyId)}&status=${encodeURIComponent(status)}`, {
            method: "POST",
            headers: authHeader()
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showToast("🔄 상태가 변경되었습니다. (Observer 연동 알림/로그 작동)");
                const activeBookId = document.getElementById("filter-select-book").value;
                loadCopies(activeBookId);
            } else {
                alert("실패: " + data.message);
            }
        });
    }

    // 사본 폐기
    function discardCopy(copyId) {
        if (!confirm("이 사본을 정말 폐기하시겠습니까?\n폐기 시 상태가 '폐기됨'으로 변경되며 수정할 수 없습니다.")) return;

        fetch(`/book/admin/discardCopy?copyId=${encodeURIComponent(copyId)}`, {
            method: "POST",
            headers: authHeader()
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showToast("🗑️ 사본이 폐기되었습니다.");
                const activeBookId = document.getElementById("filter-select-book").value;
                loadCopies(activeBookId);
            } else {
                alert("실패: " + data.message);
            }
        });
    }

    // 로그아웃
    function logout() {
        localStorage.removeItem("accessToken");
        window.location.replace("/account/loginUI");
    }

    // 토스트 알림
    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => {
            toast.classList.remove("show");
        }, 3000);
    }
</script>
</body>
</html>
